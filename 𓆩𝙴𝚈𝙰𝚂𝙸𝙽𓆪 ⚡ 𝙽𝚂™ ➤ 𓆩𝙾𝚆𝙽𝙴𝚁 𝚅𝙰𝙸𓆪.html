    <script>
        let currentFullPeriod = "";

        function makeDraggable(el) {
            let isDragging = false, offX, offY;
            el.addEventListener('mousedown', (e) => { 
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
                isDragging = true; offX = e.clientX - el.offsetLeft; offY = e.clientY - el.offsetTop; 
            });
            document.addEventListener('mousemove', (e) => { if(isDragging) { el.style.left = (e.clientX - offX) + 'px'; el.style.top = (e.clientY - offY) + 'px'; el.style.transform = "none"; } });
            document.addEventListener('mouseup', () => { isDragging = false; });
            
            el.addEventListener('touchstart', (e) => { 
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
                isDragging = true; offX = e.touches[0].clientX - el.offsetLeft; offY = e.touches[0].clientY - el.offsetTop; 
            });
            document.addEventListener('touchmove', (e) => { if(isDragging) { el.style.left = (e.touches[0].clientX - offX) + 'px'; el.style.top = (e.touches[0].clientY - offY) + 'px'; el.style.transform = "none"; } });
            document.addEventListener('touchend', () => { isDragging = false; });
        }

        makeDraggable(document.getElementById('mainWidgetWrapper'));
        makeDraggable(document.getElementById('widget-toggle-btn'));

        function checkPassword() {
            const passInput = document.getElementById("passInput");
            
            if (passInput.value === "NSEYASIN1122") {
                const unlockSound = document.getElementById("unlockSound");
                if (unlockSound) { unlockSound.currentTime = 0; unlockSound.play().catch(e => {}); }
                const scarySound = document.getElementById("scaryAudio");
                if(scarySound) { scarySound.currentTime = 0; scarySound.play().catch(e => {}); }

                document.getElementById("login-screen").style.display = "none";
                document.getElementById("hackBox").style.display = "flex";
                document.getElementById("widget-toggle-btn").style.display = "flex";
                
                updateTimeAndPeriod();
                runAnalysis();
                startSystem();
            } else {
                const wrongVid = document.getElementById("wrongPassVid");
                if(wrongVid) { wrongVid.currentTime = 0; wrongVid.play().catch(e => {}); }

                passInput.value = "";
                passInput.placeholder = "WRONG PASSWORD!";
                passInput.style.borderColor = "#ff0055";
                passInput.style.color = "#ff0055";
                
                setTimeout(() => {
                    passInput.placeholder = "ENTER PASSWORD";
                    passInput.style.borderColor = "#00ff66";
                    passInput.style.color = "#00ff66";
                }, 2000);
            }
        }

        function toggleWidget() {
            const mainWidget = document.getElementById("mainWidgetWrapper");
            mainWidget.style.display = mainWidget.style.display === "none" ? "flex" : "none";
        }

        function startSystem() {
            setInterval(() => {
                updateTimeAndPeriod();
                
                const now = new Date();
                const periodSeconds = now.getUTCSeconds() % 30;
                if (periodSeconds === 0) {
                    runAnalysis();
                }
            }, 1000);
        }

        function updateTimeAndPeriod() {
            const now = new Date();
            const totalSeconds = now.getUTCSeconds();
            const periodSeconds = totalSeconds % 30;
            const remSec = 30 - periodSeconds;
            
            const secStr = String(remSec).padStart(2, '0');
            document.getElementById('timerText').innerText = `00:${secStr}`;

            const periodIndex = (now.getUTCHours() * 60 + now.getUTCMinutes()) * 2 + (totalSeconds >= 30 ? 2 : 1);
            currentFullPeriod = `${now.getUTCFullYear()}${String(now.getUTCMonth()+1).padStart(2,'0')}${String(now.getUTCDate()).padStart(2,'0')}1000${String(periodIndex).padStart(4,'0')}`;
            
            document.getElementById('periodNum').innerText = currentFullPeriod.slice(-4);
        }

        function runAnalysis() {
            if (!currentFullPeriod) return;

            const seed = parseInt(currentFullPeriod.slice(-5));
            let isBig = ((seed * 7) % 2 === 0);
            const trendCheck = seed % 10;
            
            if (trendCheck === 3 || trendCheck === 8) { isBig = !isBig; }

            let pattern = isBig ? "BIG" : "SMALL";
            let n1, n2;
            if(pattern === "BIG") {
                const bigNumbers = [5, 6, 7, 8, 9];
                n1 = bigNumbers[(seed) % 5];
                n2 = bigNumbers[(seed + 2) % 5];
            } else {
                const smallNumbers = [0, 1, 2, 3, 4];
                n1 = smallNumbers[(seed) % 5];
                n2 = smallNumbers[(seed + 2) % 5];
            }
            
            const resultText = document.getElementById('predictResultText');
            const num1 = document.getElementById('num1');
            const num2 = document.getElementById('num2');
            const confValue = document.getElementById('confValue');
            const confBar = document.getElementById('confBar');

            resultText.classList.remove('fire-anim');
            num1.classList.remove('fire-anim');
            num2.classList.remove('fire-anim');
            
            void resultText.offsetWidth;

            resultText.innerText = pattern;
            num1.innerText = n1;
            num2.innerText = n2;

            if(pattern === "BIG") {
                resultText.style.color = "#ff0055";
                resultText.style.textShadow = "0 0 15px #ff0055, 0 0 25px #ff0055";
            } else {
                resultText.style.color = "#ffeb3b";
                resultText.style.textShadow = "0 0 15px #ffeb3b, 0 0 25px #ffeb3b";
            }

            const winRate = 85 + (seed % 14);
            confValue.innerText = winRate + "%";
            confBar.style.width = winRate + "%";

            resultText.classList.add('fire-anim');
            num1.classList.add('fire-anim');
            num2.classList.add('fire-anim');
        }
    </script>
